<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Case Webhook System Login</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <header class="login-heading">
      <img class="login-logo" src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="52" height="52">
      <h1>Case Webhook <span>System Login</span></h1>
    </header>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in <span aria-hidden="true">→</span></button>
    </form>
  </main>
</body>
</html>
